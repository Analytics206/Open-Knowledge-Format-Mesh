# Tier-1 gate: every job here is `needs: []` under decisions/0008 — no network, no
# secrets, no model. That is what lets it run on a pull request from a fork, and it is
# the property the component manifest exists to protect.
#
# When credentialed components arrive (`okfm refresh` resolving sys:// pointers), they
# get a SEPARATE workflow gated on `main`, never this one.
name: validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mesh:
    name: mesh and docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # No `pip install` step, deliberately. If one ever appears here, the
      # zero-dependency claim in decisions/0001 has quietly stopped being true.
      #
      # One command, because that is the command an adopter runs. If CI needs a
      # different incantation than the README gives people, one of them is wrong.
      # --check writes nothing: build dry-runs, drift and the web UI index fail on
      # mismatch instead of updating.
      - name: The level 2 pipeline
        run: python dropin/okfm.py --check

      # Project-specific: this repository's four-document spec corpus. Not part of the
      # drop-in, which is why it lives in dev/.
      - name: Validate the spec corpus
        run: python dev/check_docs.py

      # The level ladder is only real if it is checked. Every component declares
      # `okfm_needs`, and this fails when one exceeds what its level allows — which is
      # how "level 2 never needs a model" stays true instead of becoming marketing.
      - name: Every component fits its level
        run: python dev/check_levels.py

      # `okfm.schema.json` is GENERATED from the same rule table the terminal validator and
      # the web UI panel read, so an adopter's editor is a third consumer of one source
      # rather than a fourth copy of the key list. This fails when the committed file and
      # the table disagree, which is the only way three validators stay in agreement.
      - name: The JSON schema is the rule table
        run: python dev/check_schema.py

      # Every `okfm <name>` the documentation tells someone to type must be one the
      # dispatcher answers to. Two were not — `validate` (six mentions, the dispatcher knew
      # it as `check`) and `index` (four, including the page a first-time author reads,
      # and it existed in no form while its config knobs shipped to every adopter).
      - name: Every documented command exists
        run: python dev/check_commands.py

      # The README's Level 2 commands, executed against a fresh project. The MECHANICAL half
      # of §13.7 only — whether a stranger understands the page is not checkable here, and
      # the script says so on every run so a green tick cannot be read as the exit criterion.
      - name: The README's own commands run
        run: python dev/check_readme.py

      # The Phase 2 exit, run rather than asserted: stand `examples/warehouse/` up in a
      # temp directory on pack + config alone, and check that dropin/ comes back
      # byte-identical AND that removing the pack makes the same mesh fail. The second half
      # is the one that matters — a pack that changes nothing when removed proves nothing.
      - name: A second domain stands up on pack + config alone
        run: python dev/check_pack_example.py

      # A pack may add domain terms; it may not widen a family it did not name. This
      # failed for most of the project's life — one overlay file reached every family, so
      # a pack's reason code became a legal `predicate`, the one vocabulary that is
      # rejected rather than warned about because traversal reads an edge as fact.
      - name: A pack adds only to the family it names
        run: python dev/check_vocab.py

      # The config the build WRITES must pass the validator the build RUNS. The pipeline
      # above cannot catch a disagreement between them: on a first run no config exists,
      # so validation passes trivially and the bad file is written afterwards. It fails on
      # the adopter's second run, on a line they did not write.
      - name: The synthesised config validates
        run: python dev/check_synthesized.py

      # The benchmark's deterministic half: the two arms, the blinding, and the rule that
      # every question must be answerable from source in BOTH arms.
      - name: Benchmark question set and arms
        run: python benchmark/run.py --check

  boundaries:
    name: boundaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # spec 13.3 — core carries no domain words. This is what keeps the scaffolding
      # distributable while it is developed against two specific domains. Bundles and
      # docs may name them freely; code may not.
      - name: No domain words in code
        run: |
          set -e
          DIRS=""
          for d in dropin tools; do [ -d "$d" ] && DIRS="$DIRS $d"; done
          [ -n "$DIRS" ] || { echo "no code directories yet"; exit 0; }
          if grep -rniE 'arxiv|sugarpaws|patron|sp3d' $DIRS; then
            echo "::error::domain word found in code — see spec 13.3"
            exit 1
          fi
          echo "clean: $DIRS"

      # spec 13.3 — the drop-in folder must be liftable. If it reaches into tools/,
      # pasting it into a stranger's project would not work.
      - name: dropin does not import from tools
        run: |
          set -e
          [ -d dropin ] || { echo "no dropin/ yet"; exit 0; }
          if grep -rnE '(^|[^.\w])(from|import)\s+tools|tools\.' dropin; then
            echo "::error::dropin/ depends on tools/ — the dependency is one-way"
            exit 1
          fi
          echo "clean"

      # decisions/0007 — the base layer must stand on its own.
      - name: Base validates with tools/ deleted
        run: |
          set -e
          rm -rf tools
          python dropin/check_bundles.py
          python dev/check_docs.py
