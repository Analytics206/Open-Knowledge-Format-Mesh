<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OKFM mesh viewer</title>
<style>
  :root{
    --ink:#16191d;
    --paper:#eef1f0;
    --panel:#f7f9f8;
    --line:#c9d2ce;
    --line-soft:#dde3e0;
    --slate:#5c6672;
    --slate-dim:#8b93a0;

    --verified:#1f6f5c;
    --machine:#4a6fa5;
    --unverified:#98a0aa;
    --stale:#c08a1e;
    --drift:#a83e2b;

    --mono: ui-monospace, "SF Mono", "JetBrains Mono", "Cascadia Mono", Menlo, Consolas, monospace;
    --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  *{box-sizing:border-box}
  /* `hidden` is only `display:none` in the UA stylesheet, so ANY author rule setting
     `display` silently beats it. `#graph` set `display:block`, which meant the graph was
     never actually hidden — it kept rendering underneath every other view. One rule, so
     switching pages cannot go wrong that way again. */
  [hidden]{display:none !important}
  html,body{height:100%}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:var(--sans); font-size:14px; line-height:1.45;
    -webkit-font-smoothing:antialiased;
    /* A column, so `main` takes whatever the header leaves. The old rule guessed the
       header's height in a `calc()` and was wrong the moment a page hid the gauges. */
    display:flex; flex-direction:column; min-height:100vh;
  }
  header{flex:none}
  /* ---------- masthead ---------- */
  header{
    border-bottom:1px solid var(--line);
    background:var(--panel);
    padding:14px 20px 0;
  }
  .brand{display:flex; align-items:baseline; gap:14px; flex-wrap:wrap}
  .brand h1{
    font-family:var(--mono); font-size:15px; font-weight:700;
    letter-spacing:.14em; text-transform:uppercase; margin:0;
  }
  .brand .sub{font-family:var(--mono); font-size:11px; color:var(--slate); letter-spacing:.06em}
  .brand .badge{
    font-family:var(--mono); font-size:10px; letter-spacing:.08em; text-transform:uppercase;
    border:1px solid var(--line); border-radius:2px; padding:2px 7px; color:var(--slate);
    background:var(--paper);
  }
  /* gauge strip */
  .gauges{display:flex; gap:0; flex-wrap:wrap; margin:14px 0 0; border-top:1px solid var(--line-soft)}
  .gauge{
    padding:10px 18px 12px 0; margin-right:18px; min-width:104px;
    border-right:1px solid var(--line-soft);
  }
  .gauge:last-child{border-right:none}
  .gauge .k{
    font-family:var(--mono); font-size:9.5px; letter-spacing:.11em; text-transform:uppercase;
    color:var(--slate-dim); display:block; margin-bottom:3px;
  }
  .gauge .v{font-family:var(--mono); font-size:19px; font-weight:600; letter-spacing:-.02em}
  .gauge .v small{font-size:11px; font-weight:400; color:var(--slate); letter-spacing:0}
  .bar{height:3px; background:var(--line-soft); margin-top:5px; position:relative; overflow:hidden}
  .bar i{position:absolute; inset:0 auto 0 0; background:var(--ink)}
  .bar.good i{background:var(--verified)} .bar.warn i{background:var(--stale)} .bar.bad i{background:var(--drift)}
  /* ---------- pages ----------
     Links, not buttons, and the hash is what decides which page you are on. That buys the
     back button, bookmarkable pages, and middle-click for free — and it is the honest
     description of what these are. The old version styled the selected tab `--paper` on a
     `--panel` header: a 2% difference, so nothing ever looked selected. */
  nav.views{display:flex; gap:3px; margin-top:14px; align-items:center}
  nav.views a{
    font-family:var(--mono); font-size:11px; letter-spacing:.09em; text-transform:uppercase;
    color:var(--slate); text-decoration:none; padding:8px 15px; border-radius:2px 2px 0 0;
    border:1px solid transparent; border-bottom:none;
  }
  nav.views a:hover{color:var(--ink); background:var(--paper)}
  nav.views a[aria-current="page"]{
    background:var(--ink); color:var(--paper); font-weight:700; border-color:var(--ink);
  }
  nav.views a:focus-visible{outline:2px solid var(--machine); outline-offset:1px}
  nav.views .lede{
    margin-left:auto; font-size:11.5px; color:var(--slate); padding-bottom:6px;
    max-width:52ch; text-align:right; line-height:1.4;
  }
  @media (max-width:760px){ nav.views .lede{display:none} }
  /* ---------- shell ---------- */
  main{display:grid; grid-template-columns:212px 1fr 268px; flex:1 1 auto; min-height:0}
  main > *{min-height:0}
  aside{border-right:1px solid var(--line); overflow-y:auto; padding:16px 14px}
  aside.detail{border-right:none; border-left:1px solid var(--line); background:var(--panel)}
  section.stage{overflow:hidden; position:relative}

  /* Each page shows only the chrome it uses. Health reads the whole mesh, so filtering it
     would be a lie; Config is not about concepts at all. */
  body[data-page="health"] main,
  body[data-page="config"] main{grid-template-columns:1fr}
  body[data-page="health"] aside,
  body[data-page="config"] aside{display:none}
  body[data-page="health"] section.stage,
  body[data-page="config"] section.stage{overflow-y:auto}
  body[data-page="config"] .gauges{display:none}
  h2.grp{
    font-family:var(--mono); font-size:9.5px; letter-spacing:.12em; text-transform:uppercase;
    color:var(--slate-dim); margin:0 0 8px; font-weight:600;
  }
  .grp + .grp{margin-top:20px}
  label.chk{display:flex; align-items:center; gap:7px; padding:3px 0; cursor:pointer; font-size:12.5px}
  label.chk input{accent-color:var(--ink); margin:0}
  label.chk .swatch{width:9px; height:9px; border-radius:50%; flex:none}
  label.chk .n{margin-left:auto; font-family:var(--mono); font-size:10.5px; color:var(--slate-dim)}
  /* ---------- config panel ---------- */
  /* Level 2's config, edited from level 1's page. It writes nothing on its own: the file
     goes back to disk through the browser's own save dialog, and the build is run from a
     terminal. That keeps this one file with no server behind it. */
  .cfg-wrap{max-width:1080px; margin:0 auto; padding:20px 24px 48px}
  .cfg-note{
    border:1px solid var(--line); border-left:3px solid var(--machine);
    background:var(--panel); padding:11px 14px; font-size:12.5px; line-height:1.55;
    color:var(--slate); margin-bottom:16px;
  }
  .cfg-note b{color:var(--ink)}
  .cfg-bar{display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:14px}
  .cfg-bar button{
    font-family:var(--mono); font-size:10.5px; letter-spacing:.07em; text-transform:uppercase;
    background:var(--panel); border:1px solid var(--line); color:var(--ink);
    padding:6px 12px; cursor:pointer; border-radius:2px;
  }
  .cfg-bar button:hover{border-color:var(--slate)}
  .cfg-bar button[disabled]{opacity:.4; cursor:default}
  .cfg-bar button.primary{background:var(--ink); color:var(--paper); border-color:var(--ink)}
  .cfg-bar .cfg-file{
    font-family:var(--mono); font-size:10.5px; color:var(--slate-dim); margin-left:auto;
  }
  .cfg-cols{display:grid; grid-template-columns:1fr 400px; gap:22px; align-items:start}
  @media (max-width:900px){ .cfg-cols{grid-template-columns:1fr} }
  .cfg-group{margin-bottom:22px}
  .cfg-group > h3{
    font-family:var(--mono); font-size:9.5px; letter-spacing:.12em; text-transform:uppercase;
    color:var(--slate-dim); margin:0 0 3px; font-weight:600;
  }
  .cfg-group > p.blurb{margin:0 0 10px; font-size:12px; color:var(--slate)}
  /* For the one thing this page cannot check for you. */
  .cfg-group > p.cfg-note{margin:0 0 12px; padding:9px 11px; font-size:12px; line-height:1.5;
    border:1px solid var(--line-soft); border-left:3px solid var(--stale);
    background:var(--panel); color:var(--ink)}
  .cfg-field{
    display:grid; grid-template-columns:210px 1fr; gap:12px; align-items:start;
    padding:8px 0; border-top:1px solid var(--line-soft);
  }
  .cfg-field > .k{padding-top:5px}
  .cfg-field .k label{font-size:12.5px; display:block}
  .cfg-field .k code{font-family:var(--mono); font-size:10px; color:var(--slate-dim); display:block}
  .cfg-field .help{font-size:11.5px; color:var(--slate); margin:5px 0 0; line-height:1.5}
  .cfg-field input[type=text], .cfg-field input[type=number], .cfg-field select, .cfg-field textarea{
    width:100%; font-family:var(--mono); font-size:12px; padding:5px 7px;
    border:1px solid var(--line); background:var(--paper); color:var(--ink); border-radius:2px;
  }
  .cfg-field textarea{resize:vertical; min-height:52px; line-height:1.5}
  .cfg-field input:focus, .cfg-field select:focus, .cfg-field textarea:focus{
    outline:none; border-color:var(--machine);
  }
  .cfg-field.bad input, .cfg-field.bad select, .cfg-field.bad textarea{border-color:var(--drift)}
  .cfg-field.warned input, .cfg-field.warned select, .cfg-field.warned textarea{border-color:var(--stale)}
  .cfg-field label.bool{display:flex; align-items:center; gap:8px; font-size:12.5px; padding-top:4px}
  .cfg-field label.bool input{accent-color:var(--ink); margin:0}
  .cfg-msg{font-family:var(--mono); font-size:10.5px; margin:4px 0 0; line-height:1.5}
  .cfg-msg.error{color:var(--drift)} .cfg-msg.warn{color:var(--stale)}
  .cfg-side{position:sticky; top:14px}
  .cfg-card{border:1px solid var(--line); background:var(--panel); margin-bottom:14px}
  .cfg-card > h3{
    font-family:var(--mono); font-size:9.5px; letter-spacing:.12em; text-transform:uppercase;
    color:var(--slate-dim); margin:0; padding:9px 12px; border-bottom:1px solid var(--line-soft);
    font-weight:600; display:flex; align-items:center; gap:8px;
  }
  .cfg-card > h3 .count{
    margin-left:auto; font-size:10px; letter-spacing:0; text-transform:none; color:var(--slate);
  }
  .cfg-card .body{padding:11px 12px}
  .cfg-verdict{font-size:12.5px; line-height:1.55}
  .cfg-verdict.ok{color:var(--verified)}
  .cfg-finding{padding:7px 0; border-top:1px solid var(--line-soft); font-size:12px; line-height:1.5}
  .cfg-finding:first-child{border-top:none}
  .cfg-finding .p{font-family:var(--mono); font-size:10.5px; letter-spacing:.02em}
  .cfg-finding.error .p{color:var(--drift)} .cfg-finding.warn .p{color:var(--stale)}
  .cfg-finding .hint{color:var(--slate); font-size:11.5px}
  .cfg-json{
    width:100%; min-height:280px; font-family:var(--mono); font-size:11.5px; line-height:1.5;
    border:1px solid var(--line); background:var(--paper); color:var(--ink);
    padding:10px; border-radius:2px; resize:vertical;
  }
  .cfg-json:focus{outline:none; border-color:var(--machine)}
  .cfg-json.bad{border-color:var(--drift)}
  .cfg-run{
    font-family:var(--mono); font-size:11.5px; background:var(--ink); color:var(--paper);
    padding:9px 11px; display:flex; align-items:center; gap:10px; border-radius:2px;
  }
  .cfg-run code{flex:1; overflow-x:auto; white-space:nowrap}
  .cfg-run button{
    font-family:var(--mono); font-size:9.5px; letter-spacing:.08em; text-transform:uppercase;
    background:none; border:1px solid var(--slate); color:var(--paper); padding:3px 8px;
    cursor:pointer; border-radius:2px; flex:none;
  }
  .filter-actions{margin-top:10px}
  .filter-actions button{
    font-family:var(--mono); font-size:10px; letter-spacing:.07em; text-transform:uppercase;
    background:none; border:1px solid var(--line); color:var(--slate); padding:4px 9px;
    cursor:pointer; border-radius:2px;
  }
  .filter-actions button:hover{border-color:var(--slate); color:var(--ink)}
  /* graph */
  #graph{width:100%; height:100%; display:block; cursor:grab}
  #graph.dragging{cursor:grabbing}
  .legend-note{
    position:absolute; left:14px; bottom:12px; font-family:var(--mono); font-size:10px;
    color:var(--slate-dim); background:rgba(238,241,240,.9); padding:5px 8px; border:1px solid var(--line-soft);
    line-height:1.7;
  }
  .legend-note b{color:var(--slate); font-weight:600}
  /* chains */
  .chains{height:100%; overflow-y:auto; padding:18px 22px}
  .chain{border-bottom:1px solid var(--line-soft); padding:13px 0}
  .chain:last-child{border-bottom:none}
  .chain .ttl{font-size:13px; font-weight:600; margin-bottom:2px}
  .chain .meta{font-family:var(--mono); font-size:10px; color:var(--slate-dim); letter-spacing:.05em; margin-bottom:9px}
  .track{display:grid; grid-template-columns:repeat(5,1fr); gap:6px}
  .slot{
    border:1px solid var(--line); border-radius:2px; padding:7px 9px; min-height:50px;
    background:var(--panel); cursor:pointer; position:relative;
  }
  .slot.empty{border-style:dashed; background:none; cursor:default; opacity:.62}
  .slot:not(.empty):hover{border-color:var(--ink)}
  .slot .st{
    font-family:var(--mono); font-size:8.5px; letter-spacing:.1em; text-transform:uppercase;
    color:var(--slate-dim); display:block; margin-bottom:3px;
  }
  .slot .sv{font-size:11.5px; line-height:1.3}
  .slot .dot{position:absolute; top:7px; right:7px; width:6px; height:6px; border-radius:50%}
  .chain.open .track{outline:1px solid var(--drift); outline-offset:3px}
  .verdict{
    font-family:var(--mono); font-size:10px; letter-spacing:.06em; margin-top:7px; color:var(--slate);
  }
  .verdict b{font-weight:600}
  .verdict.neg b{color:var(--drift)} .verdict.pos b{color:var(--verified)} .verdict.open b{color:var(--stale)}
  /* stats */
  .stats{height:100%; overflow-y:auto; padding:20px 24px; display:grid; gap:22px;
         grid-template-columns:repeat(auto-fit,minmax(258px,1fr)); align-content:start}
  .card{border:1px solid var(--line); background:var(--panel); padding:14px 16px 16px}
  .card h3{
    font-family:var(--mono); font-size:10px; letter-spacing:.11em; text-transform:uppercase;
    margin:0 0 3px; font-weight:600;
  }
  .card p.hint{font-size:11.5px; color:var(--slate); margin:0 0 12px; line-height:1.4}
  .row{display:flex; align-items:center; gap:9px; padding:3px 0; font-size:12px}
  .row .lbl{min-width:112px; font-family:var(--mono); font-size:10.5px; color:var(--slate)}
  .row .track2{flex:1; height:9px; background:var(--line-soft); position:relative}
  .row .track2 i{position:absolute; inset:0 auto 0 0}
  .row .num{font-family:var(--mono); font-size:11px; min-width:34px; text-align:right}
  .warnlist{list-style:none; margin:0; padding:0}
  .warnlist li{
    display:flex; gap:8px; align-items:baseline; padding:5px 0; border-bottom:1px solid var(--line-soft);
    font-size:12px;
  }
  .warnlist li:last-child{border-bottom:none}
  .warnlist .tag{
    font-family:var(--mono); font-size:9px; letter-spacing:.08em; text-transform:uppercase;
    padding:1px 5px; border-radius:2px; color:#fff; flex:none;
  }
  .warnlist code{font-family:var(--mono); font-size:11px; color:var(--slate)}
  /* detail */
  .detail h3{font-size:14px; margin:0 0 3px; line-height:1.3}
  .detail .path{font-family:var(--mono); font-size:10.5px; color:var(--slate); word-break:break-all; margin-bottom:12px}
  .pill{
    display:inline-block; font-family:var(--mono); font-size:9.5px; letter-spacing:.08em;
    text-transform:uppercase; padding:2px 7px; border-radius:2px; margin:0 4px 4px 0; color:#fff;
  }
  .pill.ghost{background:none; border:1px solid var(--line); color:var(--slate)}
  .detail dl{margin:14px 0 0; font-size:12px}
  .detail dt{
    font-family:var(--mono); font-size:9.5px; letter-spacing:.1em; text-transform:uppercase;
    color:var(--slate-dim); margin-top:11px;
  }
  .detail dd{margin:2px 0 0}
  .detail ul{margin:3px 0 0; padding-left:15px}
  .detail li{margin:2px 0; font-size:12px}
  .detail a{color:var(--machine); text-decoration:none; border-bottom:1px solid rgba(74,111,165,.35); cursor:pointer}
  .detail a:hover{border-bottom-color:var(--machine)}
  .bodytext{
    font-family:var(--mono); font-size:11px; line-height:1.55; white-space:pre-wrap;
    word-break:break-word; background:var(--paper); border:1px solid var(--line-soft);
    padding:10px 11px; margin:5px 0 0; max-height:340px; overflow-y:auto; color:var(--ink);
  }
  .nobody{
    margin-top:16px; padding:9px 10px; border:1px dashed var(--line); font-size:11px;
    color:var(--slate); line-height:1.5;
  }
  .empty-state{padding:40px 16px; color:var(--slate-dim); font-size:12.5px; text-align:center; line-height:1.6}
  .empty-state code{font-family:var(--mono); font-size:11px}
  @media (max-width:1080px){
    main{grid-template-columns:1fr; height:auto}
    aside{border-right:none; border-bottom:1px solid var(--line)}
    aside.detail{border-left:none; border-top:1px solid var(--line)}
    section.stage{height:60vh}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important; animation:none!important}}
</style>
</head>
<body>

<header>
  <div class="brand">
    <h1>OKFM</h1>
    <span class="sub" id="meshName">mesh</span>
    <span class="badge" id="okfmVer">okfm 0.2.1</span>
    <span class="badge">okf 0.2</span>
    <span class="badge" id="genAt">derived view</span>
  </div>
  <div class="gauges" id="gauges"></div>
  <nav class="views" aria-label="Pages">
    <a href="#graph"   data-view="graph">Graph</a>
    <a href="#closure" data-view="chains">Closure</a>
    <a href="#health"  data-view="stats">Health</a>
    <a href="#config"  data-view="config">Config</a>
    <span class="lede" id="lede"></span>
  </nav>
</header>

<main>
  <aside id="filters"></aside>
  <section class="stage">
    <svg id="graph" hidden></svg>
    <div class="legend-note" id="legendNote" hidden>
      <b>ring</b> solid = human-verified · dashed = machine · none = unverified<br>
      <b>halo</b> amber = past stale_after · rust = source drifted<br>
      <b>size</b> = inbound references<br>
      <b>scroll</b> to zoom · drag the background to pan · double-click to reset
    </div>
    <div class="chains" id="chains" hidden></div>
    <div class="stats" id="stats" hidden></div>
    <div id="config" hidden></div>
  </section>
  <aside class="detail" id="detail"></aside>
</main>

<script>
/* ============================================================================
   OKFM viewer — metadata-only projection of a mesh.
   Generated by `okfm view`. NEVER contains concept bodies: a rendered copy of
   a bundle is a second home for its knowledge (spec 3.14 / 20.3).
   Trust and staleness are DERIVED here at render time, never read from stored
   fields (spec 3.4).
   ==========================================================================*/

/* ---------- data sources, in priority order ----------------------------------
   1. ./okfm-index.json      generated by `okfm view` from the real mesh
   2. BOOTSTRAP              the bundled okfm-guide, baked in at ship time
   3. empty state            no mesh, no guide -> instructions

   Fetch only works over http(s). Opened straight from disk (file://) browsers
   block it, so the baked guide is what you see. Run `okfm view --serve` for a
   live view of your own mesh.
-----------------------------------------------------------------------------*/
const INDEX_URL = (window.OKFM_INDEX_URL) || "./okfm-index.json";

/* The config panel's two baked blocks, both written by `okfm view`.
   CONFIG_SCHEMA is dropin/config_schema.py's table verbatim — the rules exist once and are
   read by the terminal validator and by this page. CONFIG is okfm.json as it sat on disk at
   bake time, so the panel opens on the real file rather than a blank form. */
const CONFIG_SCHEMA = {
 "version": "0.2.1",
 "handles": [
  "env",
  "file",
  "keyring",
  "op",
  "vault",
  "aws-sm",
  "gcp-sm",
  "azure-kv"
 ],
 "loopback": [
  "localhost",
  "127.0.0.1",
  "::1",
  "0.0.0.0"
 ],
 "groups": [
  [
   "",
   "Profile",
   "What this file is."
  ],
  [
   "build",
   "Build",
   "What gets read, and what gets written."
  ],
  [
   "bundles",
   "Bundles",
   "Name them and discovery stops. Usually leave this empty."
  ],
  [
   "read",
   "Read",
   "Consuming a mesh rather than producing one."
  ],
  [
   "enrich",
   "Enrich — Level 2+",
   "A model on hardware you control drafts the descriptions extraction cannot write. No key, no account, no bill — the same terms as Level 2, plus a model you already have.",
   "The model must already be pulled on that Ollama instance: `ollama pull <model>`. Nothing here downloads it, and this page cannot check — a page opened from file:// cannot see your machine, let alone another one on your network. A name that is not there fails at run time with a 404 naming the model. Nothing in the build reads any of this; only `okfm.py enrich-local` does."
  ],
  [
   "stores",
   "Stores",
   "External data. Handles only."
  ],
  [
   "federation",
   "Federation",
   "Who registers whom."
  ]
 ],
 "fields": [
  {
   "path": "okfm",
   "kind": "string",
   "default": "0.2.1",
   "required": true,
   "label": "Profile version",
   "help": "Which OKFM profile this config is written against."
  },
  {
   "path": "pack",
   "kind": "path",
   "base": "project",
   "exists": "dir",
   "default": null,
   "required": true,
   "nullable": true,
   "label": "Domain pack",
   "help": "Path to a domain pack directory, or null for none. The key must be present even when empty — a mesh with no domain is a normal mesh, not a missing answer. A path rather than a bare name (DR-0014): a name needs a search order, and a search order picks the wrong directory silently."
  },
  {
   "path": "build.root",
   "kind": "path",
   "base": "project",
   "exists": "dir",
   "default": "docs",

const EMPTY = { name:"no mesh found", generated_at:"—", bundles:[], concepts:[] };

let MESH = EMPTY, SOURCE = "empty", BUNDLE_ROOT = ".";

async function loadMesh(){
  try{
    const res = await fetch(INDEX_URL, {cache:"no-store"});
    if(res.ok){
      const j = await res.json();
      if(j && Array.isArray(j.concepts)){
        MESH = j; SOURCE = "live";
        BUNDLE_ROOT = j.bundle_root || ".";
        return;
      }
    }
  }catch(e){ /* file:// or no index — fall through */ }
  // "baked", not "guide". Any baked bootstrap used to be labelled the bundled demo, so the
  // normal successful outcome of a level 2 build — your own mesh, correctly baked into your
  // own page — rendered as an amber warning claiming it had failed to find your mesh. There
  // was no state meaning "this worked", so success borrowed failure's.
  if(BOOTSTRAP.concepts.length){ MESH = BOOTSTRAP; SOURCE = "baked"; BUNDLE_ROOT = "."; }
}

/* ---------- type palette (cool instrument set) ---------- */
const TYPE_COLOR = {
  "Goal":"#3f6ea8","Evidence":"#6d8ba8","Evaluation":"#7a6aa0","Decision":"#1f6f5c",
  "Experiment":"#c08a1e","Outcome":"#a83e2b","Feedback":"#8b6f9e","Answer":"#2f7d8c",
  "Concept":"#3d5a45","Perspective":"#5d8a70","Rule":"#2b6b4f","Attested Computation":"#14544a",
  "Metric":"#4f7f70","Source System":"#6b7480","OKF Member":"#6b5b95"
};
const LOOP_TYPES = ["Goal","Evidence","Evaluation","Decision","Experiment","Outcome","Feedback","Answer"];
const color = t => TYPE_COLOR[t] || "#6b7480";

/* ---------- derivations (never stored) ---------- */
const today = MESH.today || new Date().toISOString().slice(0,10);
function trustOf(c){ return c.v === "human" ? "human" : c.v === "machine" ? "machine" : "unverified"; }
function freshOf(c){
  // Three states plus staleness, never two. `drift: null` means the pointer has NEVER
  // been observed -- and rendering that as "fresh" would be a stored opinion wearing a
  // computed one's clothes, which is the failure spec 3.4 exists to prevent (DR-0006).
  // Known-bad outranks known-due outranks not-known.
  if (c.drift === 1) return "drifted";
  if (c.sa && c.sa <= today) return "stale";
  if (c.drift === null || c.drift === undefined) return "unknown";
  return "fresh";
}
const TRUST_COLOR = {human:"var(--verified)", machine:"var(--machine)", unverified:"var(--unverified)"};
const TRUST_HEX   = {human:"#1f6f5c", machine:"#4a6fa5", unverified:"#98a0aa"};
const TRUST_LABEL = {human:"human-reviewed", machine:"machine-confirmed", unverified:"unverified"};
const FRESH_HEX   = {fresh:"#1f6f5c", stale:"#c08a1e", drifted:"#a83e2b", unknown:"#98a0aa"};

let byPath = new Map(), types = [];
function derive(){
  MESH.concepts.forEach(c => { c.r = c.r || []; c.trust = trustOf(c); c.fresh = freshOf(c); });
  byPath = new Map(MESH.concepts.map(c => [c.p, c]));
  const inbound = new Map();
  MESH.concepts.forEach(c => c.r.forEach(([,tgt]) => inbound.set(tgt, (inbound.get(tgt)||0)+1)));
  MESH.concepts.forEach(c => c.inb = inbound.get(c.p) || 0);
  types = [...new Set(MESH.concepts.map(c=>c.t))].sort();
}

/* ---------- filter state ---------- */
const state = {
  view:"graph", types:new Set(), trust:new Set(["human","machine","unverified"]),
  fresh:new Set(["fresh","stale","drifted","unknown"]), bundles:new Set(), selected:null, body:null
};
function resetFilters(){
  state.types = new Set(types);
  state.trust = new Set(["human","machine","unverified"]);
  state.fresh = new Set(["fresh","stale","drifted","unknown"]);
  state.bundles = new Set(MESH.bundles.map(b=>b.id));
}
const visible = () => MESH.concepts.filter(c =>
  state.types.has(c.t) && state.trust.has(c.trust) && state.fresh.has(c.fresh) && state.bundles.has(c.b));

/* ---------- gauges ---------- */
const isGuide = c => c.scope === "guide";
const meshOnly = () => MESH.concepts.filter(c => !isGuide(c));

function gauges(){
  // Guide concepts are documentation, not knowledge: excluded from every number
  // unless the guide is all there is.
  const real = meshOnly();
  const all = real.length ? real : MESH.concepts, n = all.length;
  const humanV = all.filter(c=>c.trust==="human").length;
  const stale  = all.filter(c=>c.fresh!=="fresh").length;
  // outcome closure: decisions that commit (trial/adopt) reachable to an Outcome
  const commits = all.filter(c=>c.t==="Decision" && (c.act==="trial"||c.act==="adopt"));
  const closed = commits.filter(d => reachesOutcome(d.p)).length;
  // attestation coverage: Rules with an implemented_by to an Attested Computation
  const rules = all.filter(c=>c.t==="Rule");
  const attested = rules.filter(r => r.r.some(([p,t]) => p==="implemented_by" && byPath.get(t)?.t==="Attested Computation")).length;
  const orphans = all.filter(c => c.r.length===0 && c.inb===0).length;

  const g = [
    {k:"concepts", v:n, sub:` / ${MESH.bundles.length} bundles`},
    {k:"human-verified", v:pct(humanV,n), sub:`${humanV}/${n}`, bar:humanV/n, cls:"good"},
    {k:"needs review", v:stale, sub:" stale or drifted", bar:stale/n, cls:stale?"warn":"good"},
    {k:"outcome closure", v:pct(closed,commits.length), sub:`${closed}/${commits.length}`, bar:commits.length?closed/commits.length:1, cls:closed===commits.length?"good":"warn"},
    {k:"rules attested", v:pct(attested,rules.length), sub:`${attested}/${rules.length}`, bar:rules.length?attested/rules.length:1, cls:attested===rules.length?"good":"warn"},
    {k:"orphans", v:orphans, sub:" unlinked", bar:orphans/n, cls:orphans?"warn":"good"}
  ];
  document.getElementById("gauges").innerHTML = g.map(x=>`
    <div class="gauge">
      <span class="k">${x.k}</span>
      <span class="v">${x.v}<small>${x.sub||""}</small></span>
      ${x.bar!==undefined?`<span class="bar ${x.cls||""}"><i style="width:${Math.round(x.bar*100)}%"></i></span>`:""}
    </div>`).join("");
}
const pct = (a,b) => b ? Math.round(a/b*100)+"%" : "—";

function reachesOutcome(start){
  // walk outward through relations in both directions, depth-limited
  const seen = new Set([start]); let frontier = [start];
  for (let d=0; d<3; d++){
    const next = [];
    for (const p of frontier){
      const c = byPath.get(p); if(!c) continue;
      const nbrs = [...c.r.map(([,t])=>t), ...MESH.concepts.filter(x=>x.r.some(([,t])=>t===p)).map(x=>x.p)];
      for (const nb of nbrs){
        if (seen.has(nb)) continue;
        if (byPath.get(nb)?.t === "Outcome") return true;
        seen.add(nb); next.push(nb);
      }
    }
    frontier = next;
  }
  return false;
}

/* ---------- filter panel ---------- */
function filters(){
  const counts = t => MESH.concepts.filter(c=>c.t===t).length;
  const grp = (title, items) => `<h2 class="grp">${title}</h2>${items}`;
  const chk = (set,val,label,sw,n) =>
    `<label class="chk"><input type="checkbox" data-set="${set}" value="${val}" ${state[set].has(val)?"checked":""}>
      ${sw?`<span class="swatch" style="background:${sw}"></span>`:""}<span>${label}</span>
      ${n!==undefined?`<span class="n">${n}</span>`:""}</label>`;
  document.getElementById("filters").innerHTML =
    grp("Type", types.map(t=>chk("types",t,t,color(t),counts(t))).join("")) +
    grp("Trust", ["human","machine","unverified"].map(v=>chk("trust",v,TRUST_LABEL[v],TRUST_HEX[v],
        MESH.concepts.filter(c=>c.trust===v).length)).join("")) +
    grp("Freshness", ["fresh","stale","drifted","unknown"].map(v=>chk("fresh",v,v,FRESH_HEX[v],
        MESH.concepts.filter(c=>c.fresh===v).length)).join("")) +
    grp("Bundle", MESH.bundles.map(b=>chk("bundles",b.id,b.id,null,
        MESH.concepts.filter(c=>c.b===b.id).length)).join("")) +
    `<div class="filter-actions"><button id="resetF">reset filters</button></div>`;

  document.querySelectorAll('#filters input').forEach(el=>{
    el.addEventListener("change", ()=>{
      const s = state[el.dataset.set];
      el.checked ? s.add(el.value) : s.delete(el.value);
      render();
    });
  });
  document.getElementById("resetF").onclick = ()=>{ resetFilters(); filters(); render(); };
}

/* ---------- graph ---------- */
const svg = document.getElementById("graph");
let nodes = [], links = [], simTimer = null;

function buildGraph(){
  const vis = visible(), vset = new Set(vis.map(c=>c.p));
  const prev = new Map(nodes.map(n=>[n.p,n]));
  const W = svg.clientWidth || 800, H = svg.clientHeight || 500;
  nodes = vis.map((c,i)=>{
    const o = prev.get(c.p);
    return { p:c.p, c, x:o?o.x:W/2 + Math.cos(i)*160 + (Math.random()-.5)*40,
             y:o?o.y:H/2 + Math.sin(i*1.7)*140 + (Math.random()-.5)*40, vx:0, vy:0 };
  });
  const idx = new Map(nodes.map(n=>[n.p,n]));
  links = [];
  vis.forEach(c => c.r.forEach(([pred,tgt]) => {
    if (vset.has(tgt)) links.push({ s:idx.get(c.p), t:idx.get(tgt), pred });
  }));
  runSim();
}

function runSim(){
  clearInterval(simTimer);
  let alpha = 1;
  simTimer = setInterval(()=>{
    tick(alpha); alpha *= 0.96;
    drawGraph();
    if (alpha < 0.02) clearInterval(simTimer);
  }, 16);
}

function tick(alpha){
  const W = svg.clientWidth||800, H = svg.clientHeight||500;
  for (let i=0;i<nodes.length;i++){
    const a = nodes[i];
    for (let j=i+1;j<nodes.length;j++){
      const b = nodes[j];
      let dx = b.x-a.x, dy = b.y-a.y, d2 = dx*dx+dy*dy || 0.01;
      if (d2 > 90000) continue;
      const f = 2600/d2, d = Math.sqrt(d2), fx = dx/d*f, fy = dy/d*f;
      a.vx -= fx; a.vy -= fy; b.vx += fx; b.vy += fy;
    }
  }
  links.forEach(l=>{
    const dx = l.t.x-l.s.x, dy = l.t.y-l.s.y, d = Math.hypot(dx,dy)||0.01;
    const f = (d-105)*0.012, fx = dx/d*f, fy = dy/d*f;
    l.s.vx += fx; l.s.vy += fy; l.t.vx -= fx; l.t.vy -= fy;
  });
  nodes.forEach(n=>{
    n.vx += (W/2 - n.x)*0.0016; n.vy += (H/2 - n.y)*0.0016;
    if (n.fixed) { n.vx = n.vy = 0; return; }
    n.x += n.vx*alpha*1.6; n.y += n.vy*alpha*1.6;
    n.vx *= 0.72; n.vy *= 0.72;
    n.x = Math.max(28, Math.min(W-28, n.x)); n.y = Math.max(28, Math.min(H-28, n.y));
  });
}

const radius = n => 6 + Math.min(n.c.inb, 6) * 1.9;

/* Pan and zoom live entirely in the viewBox. The simulation keeps working in the same
   coordinate space it always did, so nothing downstream — layout, drag, hit-testing —
   has to know the view moved. */
const view = { x:0, y:0, k:1 };
const clampK = k => Math.max(0.35, Math.min(9, k));

function drawGraph(){
  const W = svg.clientWidth||800, H = svg.clientHeight||500;
  svg.setAttribute("viewBox", `${view.x} ${view.y} ${W/view.k} ${H/view.k}`);
  const edge = links.map(l=>{
    const dashed = ["differs_from","supersedes"].includes(l.pred);
    return `<line x1="${l.s.x}" y1="${l.s.y}" x2="${l.t.x}" y2="${l.t.y}"
      stroke="#b6c0bb" stroke-width="1" ${dashed?'stroke-dasharray="3 3"':""}/>`;
  }).join("");
  const node = nodes.map(n=>{
    const c = n.c, r = radius(n), sel = state.selected===c.p;
    const halo = c.fresh!=="fresh"
      ? `<circle cx="${n.x}" cy="${n.y}" r="${r+4.5}" fill="none" stroke="${FRESH_HEX[c.fresh]}" stroke-width="1.5" opacity=".85"/>` : "";
    const ring = c.trust==="human"
      ? `<circle cx="${n.x}" cy="${n.y}" r="${r+1.6}" fill="none" stroke="#16191d" stroke-width="1.4"/>`
      : c.trust==="machine"
      ? `<circle cx="${n.x}" cy="${n.y}" r="${r+1.6}" fill="none" stroke="#16191d" stroke-width="1.1" stroke-dasharray="2.5 2.5" opacity=".65"/>` : "";
    const selRing = sel ? `<circle cx="${n.x}" cy="${n.y}" r="${r+8}" fill="none" stroke="#16191d" stroke-width="1" opacity=".45"/>` : "";
    const lbl = (r>8 || sel || view.k>1.6) ? `<text x="${n.x}" y="${n.y+r+11}" text-anchor="middle"
        font-family="ui-monospace,monospace" font-size="9" fill="#5c6672">${esc(c.title.slice(0,26))}</text>` : "";
    return `<g class="nd" data-p="${esc(c.p)}" style="cursor:pointer">${halo}
      <circle cx="${n.x}" cy="${n.y}" r="${r}" fill="${color(c.t)}" opacity=".92"/>${ring}${selRing}${lbl}
      <title>${esc(c.title)} — ${c.t}</title></g>`;
  }).join("");
  svg.innerHTML = edge + node;
  svg.querySelectorAll(".nd").forEach(g=>{
    g.addEventListener("click", ()=> select(g.dataset.p));
  });
}
const esc = s => String(s).replace(/[&<>"]/g, m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));

/* drag a node, or pan the background */
let drag = null, pan = null;
svg.addEventListener("mousedown", e=>{
  const pt = mouse(e); let best=null, bd=1e9;
  nodes.forEach(n=>{ const d=Math.hypot(n.x-pt.x,n.y-pt.y); if(d<bd && d<radius(n)+6){bd=d;best=n;} });
  if(best){ drag=best; best.fixed=true; svg.classList.add("dragging"); }
  else { pan = { sx:e.clientX, sy:e.clientY, ox:view.x, oy:view.y }; svg.classList.add("dragging"); }
});
window.addEventListener("mousemove", e=>{
  if(drag){ const pt = mouse(e); drag.x = pt.x; drag.y = pt.y; drawGraph(); return; }
  if(!pan) return;
  const r = svg.getBoundingClientRect();
  const W = svg.clientWidth||800, H = svg.clientHeight||500;
  view.x = pan.ox - (e.clientX-pan.sx)/r.width  * (W/view.k);
  view.y = pan.oy - (e.clientY-pan.sy)/r.height * (H/view.k);
  drawGraph();
});
window.addEventListener("mouseup", ()=>{
  if(drag){ drag.fixed=false; drag=null; svg.classList.remove("dragging"); runSim(); }
  if(pan){ pan=null; svg.classList.remove("dragging"); }
});

/* Zoom about the pointer: the graph point under the cursor stays under the cursor.
   Zooming about the centre instead is the version everyone builds first and nobody
   likes — the thing you were aiming at slides away as you zoom toward it. */
svg.addEventListener("wheel", e=>{
  if(svg.hasAttribute("hidden")) return;   // not `.hidden` — SVGElement does not have it
  e.preventDefault();
  const r = svg.getBoundingClientRect();
  // A collapsed or not-yet-laid-out pane reports a zero-sized rect, and dividing by it
  // puts NaN into the viewBox — which does not throw, it just blanks the graph.
  if(!r.width || !r.height) return;
  const W = svg.clientWidth||800, H = svg.clientHeight||500;
  const fx = (e.clientX-r.left)/r.width, fy = (e.clientY-r.top)/r.height;
  const px = view.x + fx*(W/view.k), py = view.y + fy*(H/view.k);
  // deltaMode 1 is lines rather than pixels; Firefox reports it and would otherwise
  // zoom about forty times per notch.
  const dy = e.deltaY * (e.deltaMode===1 ? 16 : e.deltaMode===2 ? H : 1);
  view.k = clampK(view.k * Math.exp(-dy*0.0015));
  view.x = px - fx*(W/view.k);
  view.y = py - fy*(H/view.k);
  drawGraph();
}, { passive:false });

svg.addEventListener("dblclick", ()=>{ view.x=view.y=0; view.k=1; drawGraph(); });

function mouse(e){
  const r = svg.getBoundingClientRect();
  return { x: view.x + (e.clientX-r.left)/(r.width ||1) * ((svg.clientWidth ||800)/view.k),
           y: view.y + (e.clientY-r.top) /(r.height||1) * ((svg.clientHeight||500)/view.k) };
}

/* ---------- closure view ---------- */
const SLOTS = ["Goal","Evaluation","Decision","Experiment","Outcome"];
function buildChains(){
  const vis = new Set(visible().map(c=>c.p));
  const goals = MESH.concepts.filter(c=>c.t==="Goal" && vis.has(c.p));
  const el = document.getElementById("chains");
  if(!goals.length){ el.innerHTML = `<div class="empty-state">No goals in the current filter.<br>Closure tracks start from a <code>Goal</code>.</div>`; return; }

  el.innerHTML = goals.map(g=>{
    const serving = MESH.concepts.filter(c => c.r.some(([p,t]) => t===g.p && (p==="serves"||p==="derived_from")));
    const pick = t => serving.filter(c=>c.t===t);
    const evals = pick("Evaluation"), decs = pick("Decision");
    // experiments/outcomes hang off decisions
    const exps = MESH.concepts.filter(c=>c.t==="Experiment" && c.r.some(([,t])=>decs.some(d=>d.p===t)));
    const outs = MESH.concepts.filter(c=>c.t==="Outcome" &&
        MESH.concepts.some(x=>x.t==="Experiment" && exps.some(e=>e.p===x.p) && x.r.some(([p,t])=>p==="resulted_in"&&t===c.p)));
    const row = [g, evals[0]||null, decs[0]||null, exps[0]||null, outs[0]||null];

    const committed = decs.some(d=>d.act==="trial"||d.act==="adopt");
    const open = committed && !outs.length;
    const out = outs[0];
    const verdict = out
      ? `<div class="verdict ${out.val==="positive"?"pos":"neg"}">outcome recorded — durable value <b>${out.val}</b>${
          decs[0]?.act==="trial" && out.val==="negative" ? " · evaluation said promising" : ""}</div>`
      : decs.some(d=>d.act==="reject")
      ? `<div class="verdict">closed at decision — <b>rejected</b>, no experiment needed</div>`
      : open
      ? `<div class="verdict open">committed but <b>no outcome recorded</b> — open loop</div>`
      : `<div class="verdict">no decision yet — <b>in flight</b></div>`;

    const track = row.map((c,i)=> c
      ? `<div class="slot" data-p="${esc(c.p)}">
           <span class="dot" style="background:${TRUST_HEX[c.trust]}"></span>
           <span class="st">${SLOTS[i]}</span><span class="sv">${esc(c.title)}</span></div>`
      : `<div class="slot empty"><span class="st">${SLOTS[i]}</span><span class="sv">—</span></div>`).join("");

    const extra = evals.length>1 ? ` · ${evals.length} evaluations` : "";
    return `<div class="chain ${open?"open":""}">
      <div class="ttl">${esc(g.title)}</div>
      <div class="meta">${g.b}${extra}</div>
      <div class="track">${track}</div>${verdict}</div>`;
  }).join("");

  el.querySelectorAll(".slot[data-p]").forEach(s=> s.addEventListener("click", ()=>select(s.dataset.p)));
}

/* ---------- health view ---------- */
function buildStats(){
  const all = MESH.concepts, n = all.length;
  const bar = (label, val, total, hex) => `
    <div class="row"><span class="lbl">${label}</span>
      <span class="track2"><i style="width:${total?Math.round(val/total*100):0}%;background:${hex}"></i></span>
      <span class="num">${val}</span></div>`;

  const typeRows = types.map(t=>bar(t.toLowerCase(), all.filter(c=>c.t===t).length, n, color(t))).join("");
  const trustRows = ["human","machine","unverified"].map(v=>
    bar(TRUST_LABEL[v], all.filter(c=>c.trust===v).length, n, TRUST_HEX[v])).join("");
  const freshRows = ["fresh","stale","drifted","unknown"].map(v=>
    bar(v, all.filter(c=>c.fresh===v).length, n, FRESH_HEX[v])).join("");

  const needs = all.filter(c=>c.fresh!=="fresh" || c.trust==="unverified" || (c.r.length===0&&c.inb===0)
                 || c.recon==="material_mismatch" || c.recon==="unreviewed");
  const warn = needs.map(c=>{
    const [tag,hex] = c.fresh==="drifted" ? ["drift","#a83e2b"]
      : c.recon==="material_mismatch" ? ["mismatch","#a83e2b"]
      : c.fresh==="stale" ? ["stale","#c08a1e"]
      : c.trust==="unverified" ? ["unverified","#98a0aa"]
      : c.recon==="unreviewed" ? ["unreconciled","#c08a1e"] : ["orphan","#98a0aa"];
    return `<li><span class="tag" style="background:${hex}">${tag}</span>
      <span><a data-p="${esc(c.p)}" style="cursor:pointer">${esc(c.title)}</a><br><code>${esc(c.p)}</code></span></li>`;
  }).join("");

  const commits = all.filter(c=>c.t==="Decision" && (c.act==="trial"||c.act==="adopt"));
  const closed = commits.filter(d=>reachesOutcome(d.p));
  const outs = all.filter(c=>c.t==="Outcome");
  const neg = outs.filter(o=>o.val==="negative").length;

  document.getElementById("stats").innerHTML = `
    <div class="card"><h3>Composition</h3>
      <p class="hint">What this mesh is made of. A mesh that is all meaning and no loop family has no memory of its own decisions.</p>
      ${typeRows}</div>
    <div class="card"><h3>Trust</h3>
      <p class="hint">Derived from whether a human actor appears in <code>verified</code> — never stored.</p>
      ${trustRows}</div>
    <div class="card"><h3>Freshness</h3>
      <p class="hint">Stale is a passed <code>stale_after</code> date. Drifted means a cited source changed since capture.</p>
      ${freshRows}</div>
    <div class="card"><h3>Loop closure</h3>
      <p class="hint">Committed decisions that reached a recorded outcome. An open loop is a decision nobody checked.</p>
      ${bar("committed", commits.length, commits.length||1, "#3f6ea8")}
      ${bar("closed", closed.length, commits.length||1, "#1f6f5c")}
      ${bar("outcomes neg.", neg, outs.length||1, "#a83e2b")}
      <p class="hint" style="margin:10px 0 0">${neg} of ${outs.length} recorded outcomes were negative — the reason evaluation and outcome are stored separately.</p>
    </div>
    <div class="card" style="grid-column:1/-1"><h3>Review queue — ${needs.length}</h3>
      <p class="hint">Everything the mesh believes needs a human before it is relied on.</p>
      <ul class="warnlist">${warn}</ul></div>`;

  document.querySelectorAll("#stats a[data-p]").forEach(a=>a.addEventListener("click",()=>select(a.dataset.p)));
}

/* ---------- detail ---------- */
function select(p){
  state.selected = p; state.body = null;
  // Health has no detail pane — it reads the whole mesh, so a per-concept sidebar would be
  // beside the point. Clicking a concept there means "show me this one", so go where that
  // can be answered rather than selecting something nobody can see.
  if(pageFromHash()==="health") location.hash = "graph";
  detail();
  if(pageFromHash()==="graph") drawGraph();
  loadBody(p);
}

/* Bodies are FETCHED from the bundle, never embedded in this file.
   Served -> live body, always current. file:// -> unavailable, say so. */
async function loadBody(p){
  const url = BUNDLE_ROOT.replace(/\/$/,"") + p;
  try{
    const res = await fetch(url, {cache:"no-store"});
    if(!res.ok) throw 0;
    let txt = await res.text();
    txt = txt.replace(/^---[\s\S]*?\n---\n/, "").trim();   // strip frontmatter
    if(state.selected === p){ state.body = txt.slice(0, 6000); detail(); }
  }catch(e){
    if(state.selected === p){ state.body = false; detail(); }
  }
}

function detail(){
  const el = document.getElementById("detail");
  const c = byPath.get(state.selected);
  if(!c){
    el.innerHTML = `<div class="empty-state">Select a concept.<br><br>
      This panel shows <b>metadata only</b> — the body stays in the bundle.</div>`;
    return;
  }
  const rel = c.r.map(([pred,tgt])=>{
    const t = byPath.get(tgt);
    return `<li><code style="font-family:var(--mono);font-size:10.5px;color:var(--slate)">${pred}</code>
      → ${t?`<a data-p="${esc(tgt)}">${esc(t.title)}</a>`:`<span style="color:var(--slate-dim)">${esc(tgt)} (outside filter)</span>`}</li>`;
  }).join("");
  const back = MESH.concepts.filter(x=>x.r.some(([,t])=>t===c.p));
  const backs = back.map(x=>`<li><a data-p="${esc(x.p)}">${esc(x.title)}</a></li>`).join("");

  el.innerHTML = `
    <h3>${esc(c.title)}</h3>
    <div class="path">${esc(c.p)}</div>
    <span class="pill" style="background:${color(c.t)}">${esc(c.t)}</span>
    <span class="pill" style="background:${TRUST_HEX[c.trust]}">${TRUST_LABEL[c.trust]}</span>
    <span class="pill" style="background:${FRESH_HEX[c.fresh]}">${c.fresh}</span>
    ${c.recon?`<span class="pill ghost">recon: ${esc(c.recon)}</span>`:""}
    ${c.act?`<span class="pill ghost">${esc(c.act)}</span>`:""}
    ${c.val?`<span class="pill ghost">value ${esc(c.val)}</span>`:""}
    <dl>
      <dt>description</dt><dd>${esc(c.d)}</dd>
      <dt>bundle</dt><dd>${esc(c.b)}</dd>
      ${c.sa?`<dt>stale after</dt><dd>${c.sa}${c.sa<=today?" — passed":""}</dd>`:""}
      <dt>sources</dt><dd>${c.src} cited${c.drift?` · <span style="color:var(--drift)">${c.drift} drifted</span>`:""}</dd>
      ${rel?`<dt>relations out</dt><dd><ul>${rel}</ul></dd>`:""}
      ${backs?`<dt>referenced by</dt><dd><ul>${backs}</ul></dd>`:""}
    </dl>
    ${bodyBlock(c)}`;

  el.querySelectorAll("a[data-p]").forEach(a=>a.addEventListener("click",()=>select(a.dataset.p)));
}

function bodyBlock(c){
  if(state.body === null)
    return `<div class="nobody">Reading <code>${esc(c.p)}</code>…</div>`;
  if(state.body === false)
    return `<div class="nobody"><b>Body not available here.</b><br>
      This page holds metadata only — it never embeds concept text, so it can never
      go stale against the bundle or become a second copy of it.<br><br>
      Open <code>${esc(c.p)}</code>, or run <code>okfm view --serve</code> to read
      bodies live.</div>`;
  return `<dt style="font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;
    text-transform:uppercase;color:var(--slate-dim);margin-top:16px">body — read live from bundle</dt>
    <pre class="bodytext">${esc(state.body)}</pre>`;
}

/* ---------- config panel ----------------------------------------------------
   Level 2's okfm.json, edited from level 1's page.

   The RULES are not written here. They are baked in as CONFIG_SCHEMA from
   dropin/config_schema.py, which is the same table the terminal validator reads.
   Two copies of "what keys exist" would agree until somebody added a key to one,
   and the disagreement would be silent — this page would accept a config the
   build rejects, which is worse than having no page.

   The split is honest: everything that does not need a filesystem is checked
   here, live. Whether the paths exist is checked when you run it, because a page
   opened from file:// cannot see your disk and will not pretend to.

   Nothing is written behind your back. Save goes through the browser's own file
   dialog, and the build is run from a terminal. That is what keeps this one file
   with no server behind it.
---------------------------------------------------------------------------*/
const CFG = { data:{}, text:"", handle:null, name:"okfm.json", origin:"baked into this page",
              dirty:false, jsonError:null, touched:new Set(), note:"" };

const SCHEMA = (typeof CONFIG_SCHEMA!=="undefined") ? CONFIG_SCHEMA : {fields:[],groups:[]};
const CFIELDS = SCHEMA.fields || [];
const CBY = Object.fromEntries(CFIELDS.map(f=>[f.path,f]));
const COPEN = new Set(CFIELDS.filter(f=>["pathmap","stores","any"].includes(f.kind)).map(f=>f.path));
const RUNCMD = SCHEMA.run || "python .okfm/okfm.py";
const CLOOPBACK = SCHEMA.loopback || ["localhost","127.0.0.1","::1","0.0.0.0"];

/* ---- reading and writing a dotted path ---- */
function cdig(obj, path){
  let node = obj;
  for(const part of path.split(".")){
    if(node===null || typeof node!=="object" || !(part in node)) return [undefined,false];
    node = node[part];
  }
  return [node,true];
}
function cset(obj, path, value){
  const parts = path.split("."), last = parts.pop();
  let node = obj;
  for(const p of parts){
    if(node[p]===null || typeof node[p]!=="object") node[p] = {};
    node = node[p];
  }
  if(value===undefined){
    delete node[last];
    // Prune a group we just emptied, so removing the last key does not leave `"read": {}`
    // sitting in the file looking like a decision somebody made.
    let chain = path.split("."); chain.pop();
    while(chain.length){
      const [v] = cdig(obj, chain.join("."));
      if(v && typeof v==="object" && !Array.isArray(v) && !Object.keys(v).length){
        cset(obj, chain.join("."), undefined);
      }
      chain.pop();
    }
  } else node[last] = value;
}

/* ---- validation: the same rules as check_config.py, minus the disk ---- */
function cnorm(p){ return String(p).replace(/\\/g,"/").replace(/^\.\//,"").replace(/^\/+|\/+$/g,""); }

function cclosest(word, options){
  let best=null, bestD=Infinity;
  for(const o of options){
    const d = clev(word,o);
    if(d<bestD){ bestD=d; best=o; }
  }
  return (best && bestD<=Math.max(2, Math.floor(best.length/3))) ? best : null;
}
function clev(a,b){
  const m=a.length,n=b.length; let prev=Array.from({length:n+1},(_,j)=>j);
  for(let i=1;i<=m;i++){
    const cur=[i];
    for(let j=1;j<=n;j++)
      cur[j]=Math.min(prev[j]+1, cur[j-1]+1, prev[j-1]+(a[i-1]===b[j-1]?0:1));
    prev=cur;
  }
  return prev[n];
}

function cUnknown(cfg){
  const out=[];
  (function walk(node, prefix){
    if(node===null || typeof node!=="object" || Array.isArray(node)) return;
    for(const [key,value] of Object.entries(node)){
      if(key.startsWith("_")) continue;               // `_note`-style comments are the file's own
      const path = prefix+key;
      if(COPEN.has(path)) continue;                   // the adopter names these
      const kids = Object.keys(CBY).filter(p=>p.startsWith(path+"."));
      if(CBY[path]){ if(kids.length && value && typeof value==="object") walk(value, path+"."); continue; }
      if(kids.length){ walk(value, path+"."); continue; }
      const here = prefix.replace(/\.$/,"");
      const siblings = Object.keys(CBY)
        .filter(p => (p.includes(".") ? p.slice(0,p.lastIndexOf(".")) : "") === here)
        .map(p => p.slice(p.lastIndexOf(".")+1));
      const near = cclosest(key, siblings);
      out.push({level:"error", path, msg:"not a key anything reads",
                hint: near ? "did you mean `"+near+"`?"
                           : "remove it, or prefix it with `_` to keep it as a note"});
    }
  })(cfg, "");
  return out;
}

function cType(field, value){
  const k = field.kind;
  if(k==="any") return null;
  if(k==="string"||k==="path") return typeof value==="string" ? null : "must be a string";
  if(k==="bool") return typeof value==="boolean" ? null : "must be true or false";
  if(k==="int"){
    if(typeof value!=="number" || !Number.isInteger(value)) return "must be a whole number";
    if((field.min!=null && value<field.min) || (field.max!=null && value>field.max))
      return "must be between "+field.min+" and "+field.max;
    return null;
  }
  if(k==="enum") return field.choices.includes(value) ? null :
    "must be one of "+field.choices.map(c=>"`"+c+"`").join(", ");
  if(k==="paths"||k==="strings"){
    if(!Array.isArray(value)) return "must be a list";
    return value.every(v=>typeof v==="string") ? null : "every entry must be a string";
  }
  if(k==="pathmap"){
    if(value===null || typeof value!=="object" || Array.isArray(value)) return "must be a map of id to path";
    return Object.values(value).every(v=>typeof v==="string") ? null : "every value must be a path";
  }
  if(k==="stores")
    return (value!==null && typeof value==="object" && !Array.isArray(value)) ? null
      : "must be a map of name to store";
  return null;
}

function centries(field, value){
  if(field.kind==="path") return [[field.path, value]];
  if(field.kind==="paths") return (value||[]).map((v,i)=>[field.path+"["+i+"]", v]);
  if(field.kind==="pathmap") return Object.entries(value||{}).map(([k,v])=>[field.path+"."+k, v]);
  return [];
}

function cShape(field, value){
  if(!field.base) return [];
  const from = field.base==="root" ? "the documents root" : "the project";
  const out=[];
  for(const [where, rel] of centries(field, value)){
    if(typeof rel!=="string") continue;
    if(/^[\/\\]/.test(rel) || /^[A-Za-z]:/.test(rel) || rel.split(/[\/\\]/).includes(".."))
      out.push({level:"error", path:where, msg:"must sit inside "+from+", written relative to it"});
  }
  return out;
}

function cStores(stores){
  const out=[], handles = SCHEMA.handles || [];
  for(const [name, store] of Object.entries(stores||{})){
    if(store===null || typeof store!=="object"){
      out.push({level:"error", path:"stores."+name, msg:"must be an object"}); continue;
    }
    const profile = store.profile;
    if(profile==null){
      out.push({level:"warn", path:"stores."+name+".profile",
                msg:"no credential handle — this store will not resolve"});
    } else if(typeof profile!=="string" ||
              !new RegExp("^("+handles.join("|")+"):\\S+$").test(profile)){
      const dsn = typeof profile==="string" && profile.includes("://");
      out.push({level:"error", path:"stores."+name+".profile",
        msg:"must be a handle, not a credential"+(dsn?" — this looks like a live connection string":""),
        hint:"one of "+handles.map(h=>"`"+h+":`").join(", ")
             +". A config file is committed; a credential is not."});
    }
  }
  return out;
}

function cCross(cfg){
  const out=[];
  const [root] = cdig(cfg,"build.root"), [outDir] = cdig(cfg,"build.out");
  const [include] = cdig(cfg,"build.include");
  const [exclude] = cdig(cfg,"build.exclude");
  const [bundles, hasBundles] = cdig(cfg,"bundles");

  if(typeof root==="string" && typeof outDir==="string"){
    const r=cnorm(root), o=cnorm(outDir);
    if(o===r || o.startsWith(r+"/"))
      out.push({level:"error", path:"build.out", msg:"writes inside `"+root+"`, the folder it reads",
        hint:"the build would read its own output on the next run, and your documents would stop being only yours"});
  }
  (include||[]).forEach((entry,i)=>{
    if(typeof entry!=="string" || typeof root!=="string") return;
    const e=cnorm(entry), r=cnorm(root);
    if(e===r || e.startsWith(r+"/"))
      out.push({level:"warn", path:"build.include["+i+"]", msg:"inside `"+root+"`, so it is dropped",
        hint:"include reaches outside the root; use exclude to control what is inside it"});
  });
  // `exclude` says what gets READ. `bundles` says what the mesh IS. Excluding a folder that
  // `bundles` still names changes nothing anyone can see, which is the most confusing
  // possible outcome — the config disagrees with itself and the mesh looks broken.
  if(hasBundles && bundles && typeof bundles==="object" && typeof root==="string"){
    (exclude||[]).forEach((entry,i)=>{
      if(typeof entry!=="string") return;
      const excluded = (cnorm(root)+"/"+cnorm(entry)).replace(/^\/+|\/+$/g,"");
      for(const [bid, rel] of Object.entries(bundles)){
        if(typeof rel==="string" && cnorm(rel)===excluded)
          out.push({level:"warn", path:"build.exclude["+i+"]",
            msg:"excluded from the build, but `bundles."+bid+"` still names it — every reader still shows it",
            hint:"`exclude` controls what is READ; `bundles` is what the mesh IS. To drop it "
                +"from the mesh, remove the `bundles."+bid+"` line. To keep it as an in-place "
                +"bundle that the build must not mirror, this is already correct."});
      }
    });
  }
  // What separates level 3's local variant from its credentialed one is not the model, it is
  // where the model runs and whether reaching it costs a secret. The config is the only place
  // that is written down, so this is the only place it can be checked.
  // The switch says intent, the model says which — not redundant, and this is the only
  // combination that means nothing. The reverse, a model named while switched off, is
  // deliberately silent: it is the normal state of every config nobody has turned this on in
  // yet, and a check that fires on the common case is one people learn to ignore.
  const [enabled] = cdig(cfg,"enrich.enabled"), [emodel] = cdig(cfg,"enrich.model");
  if(enabled===true && !(typeof emodel==="string" && emodel.trim()))
    out.push({level:"error", path:"enrich.model",
      msg:"the local model is switched on and no model is named",
      hint:"name one you have already pulled — `ollama list` on that host says which — or set "
          +"`enrich.enabled` to false"});

  const [baseUrl] = cdig(cfg,"enrich.base_url");
  if(typeof baseUrl==="string" && baseUrl.trim()){
    let host="";
    try { host = new URL(baseUrl).hostname; } catch(e) { host=""; }
    if(!host)
      out.push({level:"error", path:"enrich.base_url", msg:"not a URL",
        hint:"a scheme and a host, like `http://localhost:11434`"});
    else if(!CLOOPBACK.includes(host))
      out.push({level:"warn", path:"enrich.base_url",
        msg:"`"+host+"` is not this machine, so this is no longer the local variant",
        hint:"fine if it is your own hardware — nothing here holds a key either way. But if "
            +"reaching it needs one, that credential belongs in `stores` as a handle, and the "
            +"component becomes `needs-secrets` rather than `needs-model`."});
  }
  if(hasBundles && bundles && typeof bundles==="object"){
    for(const [bid, rel] of Object.entries(bundles)){
      if(typeof rel!=="string") continue;
      const leaf = cnorm(rel).split("/").pop();
      if(leaf!==bid)
        out.push({level:"warn", path:"bundles."+bid,
          msg:"id does not match the folder name `"+leaf+"`",
          hint:"two names for one bundle, and the second exists only to be got wrong"});
    }
  }
  return out;
}

function cValidate(cfg){
  const out = cUnknown(cfg);
  for(const field of CFIELDS){
    const [value, present] = cdig(cfg, field.path);
    if(!present){
      if(field.required) out.push({level:"error", path:field.path, msg:"required, and missing", hint:field.help});
      continue;
    }
    if(value===null){
      if(!field.nullable) out.push({level:"error", path:field.path, msg:"cannot be null"});
      continue;
    }
    const problem = cType(field, value);
    if(problem){ out.push({level:"error", path:field.path, msg:problem, hint:field.help}); continue; }
    if(field.path==="okfm" && value!==SCHEMA.version)
      out.push({level:"warn", path:"okfm",
                msg:"this tooling implements "+SCHEMA.version+", the config says "+value});
    if(field.kind==="stores") out.push(...cStores(value));
    out.push(...cShape(field, value));
  }
  out.push(...cCross(cfg));
  const rank = {error:0, warn:1};
  return out.sort((a,b)=> rank[a.level]-rank[b.level] || a.path.localeCompare(b.path));
}

/* ---- the form, generated from the same table ---- */
function cInput(field, value, present){
  const id = "cf_"+field.path.replace(/\./g,"_");
  const k = field.kind;
  const shown = present ? value : field.default;
  const ph = present ? "" : ` placeholder="${esc(JSON.stringify(field.default ?? ""))}"`;
  if(k==="bool")
    return `<label class="bool"><input type="checkbox" id="${id}" data-p="${field.path}"
      ${shown?"checked":""}> ${shown?"true":"false"}</label>`;
  if(k==="enum")
    return `<select id="${id}" data-p="${field.path}">`
      + field.choices.map(c=>`<option${c===shown?" selected":""}>${esc(c)}</option>`).join("")
      + `</select>`;
  if(k==="int")
    return `<input type="number" id="${id}" data-p="${field.path}"
      value="${shown==null?"":esc(String(shown))}"${ph}>`;
  if(k==="strings"||k==="paths")
    return `<textarea id="${id}" data-p="${field.path}" rows="${Math.max(2,(shown||[]).length+1)}"
      placeholder="one per line">${esc((shown||[]).join("\n"))}</textarea>`;
  if(k==="pathmap"||k==="stores"||k==="any")
    return `<textarea id="${id}" data-p="${field.path}" rows="5" class="jsonish"
      placeholder="{ }">${esc(JSON.stringify(shown ?? (k==="any"?null:{}), null, 1))}</textarea>`;
  return `<input type="text" id="${id}" data-p="${field.path}"
    value="${shown==null?"":esc(String(shown))}"${ph}>`;
}

function cReadInput(el, field){
  const k = field.kind, raw = el.type==="checkbox" ? el.checked : el.value;
  if(k==="bool") return raw;
  if(k==="int"){ const s=String(raw).trim(); return s==="" ? undefined : Number(s); }
  if(k==="strings"||k==="paths"){
    const list = String(raw).split("\n").map(s=>s.trim()).filter(Boolean);
    return list.length ? list : (field.required ? [] : undefined);
  }
  if(k==="pathmap"||k==="stores"||k==="any"){
    const s = String(raw).trim();
    if(!s) return undefined;
    try { return JSON.parse(s); } catch(e){ return {__bad:s}; }
  }
  const s = String(raw).trim();
  if(s==="") return field.nullable && field.required ? null : undefined;
  return s;
}

function cRenderForm(findings){
  const byPath = {};
  for(const f of findings) (byPath[f.path] = byPath[f.path] || []).push(f);

  // `bundles` and `stores` are top-level AND groups of their own, so the catch-all group has
  // to know which top-level keys are somebody else's.
  const claimed = new Set((SCHEMA.groups||[]).map(([p])=>p).filter(Boolean));
  return (SCHEMA.groups||[]).map(([prefix, title, blurb, note])=>{
    const fields = CFIELDS.filter(f =>
      prefix==="" ? (!f.path.includes(".") && !claimed.has(f.path))
                  : (f.path===prefix || f.path.startsWith(prefix+".")));
    if(!fields.length) return "";
    return `<div class="cfg-group"><h3>${esc(title)}</h3><p class="blurb">${esc(blurb)}</p>`
      + (note ? `<p class="cfg-note">${esc(note)}</p>` : "")
      + fields.map(f=>{
          const [value, present] = cdig(CFG.data, f.path);
          const mine = (byPath[f.path]||[]).concat(
            findings.filter(x=>x.path.startsWith(f.path+"[") || x.path.startsWith(f.path+".")));
          const worst = mine.some(x=>x.level==="error") ? "bad"
                      : mine.length ? "warned" : "";
          return `<div class="cfg-field ${worst}">
            <div class="k"><label for="cf_${f.path.replace(/\./g,"_")}">${esc(f.label)}</label>
              <code>${esc(f.path)}${present?"":" · default"}</code></div>
            <div>${cInput(f, value, present)}
              <p class="help">${esc(f.help)}</p>
              ${mine.map(x=>`<p class="cfg-msg ${x.level}">${esc(x.path)}: ${esc(x.msg)}${
                  x.hint?" — "+esc(x.hint):""}</p>`).join("")}
            </div></div>`;
        }).join("")
      + `</div>`;
  }).join("");
}

function cRender(){
  const panel = document.getElementById("config");
  const findings = CFG.jsonError ? [] : cValidate(CFG.data);
  const errors = findings.filter(f=>f.level==="error");
  const warns  = findings.filter(f=>f.level==="warn");

  const verdict = CFG.jsonError
    ? `<p class="cfg-verdict" style="color:var(--drift)">Not valid JSON — ${esc(CFG.jsonError)}</p>`
    : errors.length
      ? `<p class="cfg-verdict" style="color:var(--drift)">${errors.length} error${errors.length>1?"s":""}. The build would read a config that does not say what you think it says.</p>`
      : `<p class="cfg-verdict ok">Readable${warns.length?` — ${warns.length} warning${warns.length>1?"s":""}`:""}.</p>`;

  panel.innerHTML = `<div class="cfg-wrap">
    <div class="cfg-note"><b>This configures the level&nbsp;2 build</b> — the Python run,
      <code>${esc(RUNCMD)}</code>. The page you are reading needs no configuration: it is one
      file, it opens from disk, and it reads nothing.<br>
      Edit here, save the file, then run it in a terminal. Nothing on this page writes to your
      project on its own.</div>

    <div class="cfg-bar">
      <button id="cfgOpen">Open okfm.json…</button>
      <button id="cfgSave" class="primary">Save</button>
      <button id="cfgDownload">Download</button>
      <button id="cfgRevert" ${CFG.dirty?"":"disabled"}>Revert</button>
      <span class="cfg-file">${esc(CFG.name)} · ${esc(CFG.origin)}${CFG.dirty?" · unsaved":""}</span>
    </div>

    <div class="cfg-cols">
      <div class="cfg-form">${CFG.jsonError ? "" : cRenderForm(findings)}</div>
      <div class="cfg-side">
        <div class="cfg-card"><h3>Validation <span class="count">${
            CFG.jsonError ? "—" : findings.length + " finding" + (findings.length===1?"":"s")}</span></h3>
          <div class="body">${verdict}
            ${findings.map(f=>`<div class="cfg-finding ${f.level}">
                <span class="p">${esc(f.path)}</span> — ${esc(f.msg)}
                ${f.hint?`<br><span class="hint">${esc(f.hint)}</span>`:""}</div>`).join("")}
            <p class="hint" style="margin:10px 0 0;font-size:11.5px;color:var(--slate-dim)">
              Whether these paths exist is checked when you run it. A page opened from
              <code>file://</code> cannot see your disk, and will not guess.</p>
          </div></div>

        <div class="cfg-card"><h3>okfm.json</h3>
          <div class="body" style="padding:0">
            <textarea class="cfg-json ${CFG.jsonError?"bad":""}" id="cfgJson"
              spellcheck="false">${esc(CFG.text)}</textarea>
          </div></div>

        <div class="cfg-run"><code>${esc(RUNCMD)}</code>
          <button id="cfgCopy">copy</button></div>
        <p style="font-size:11.5px;color:var(--slate);margin:8px 0 0;line-height:1.5">
          Add <code>--check</code> to validate without writing. <code>${esc(RUNCMD)} config</code>
          runs these same rules in the terminal, plus the ones that need a filesystem.</p>
      </div>
    </div>
  </div>`;

  cWire();
}

/* ---- wiring ---- */
function cSync(fromForm){
  if(fromForm){ CFG.text = JSON.stringify(CFG.data, null, 2); CFG.jsonError = null; }
  CFG.dirty = true;
  cRender();
}

function cWire(){
  const panel = document.getElementById("config");

  panel.querySelectorAll("[data-p]").forEach(el=>{
    const field = CBY[el.dataset.p];
    const evt = (el.tagName==="TEXTAREA") ? "change" : "input";
    el.addEventListener(evt, ()=>{
      const value = cReadInput(el, field);
      if(value && value.__bad!==undefined) return;     // half-typed JSON: wait for valid
      cset(CFG.data, field.path, value);
      CFG.touched.add(field.path);
      cSync(true);
      const again = document.getElementById(el.id);
      if(again){ again.focus(); if(again.setSelectionRange && again.type!=="number"){
        try{ again.setSelectionRange(again.value.length, again.value.length); }catch(e){} } }
    });
  });

  const json = document.getElementById("cfgJson");
  if(json) json.addEventListener("change", ()=>{
    try{
      CFG.data = JSON.parse(json.value); CFG.text = json.value; CFG.jsonError = null;
    }catch(e){ CFG.text = json.value; CFG.jsonError = e.message; }
    CFG.dirty = true; cRender();
  });

  const on = (id, fn)=>{ const b=document.getElementById(id); if(b) b.addEventListener("click", fn); };
  on("cfgOpen", cOpen);
  on("cfgSave", cSave);
  on("cfgDownload", ()=>cDownload(CFG.text));
  on("cfgRevert", ()=>{ cLoad(JSON.stringify(CONFIG, null, 2), "okfm.json", "baked into this page", null); });
  on("cfgCopy", async e=>{
    try{ await navigator.clipboard.writeText(RUNCMD); e.target.textContent="copied"; }
    catch(err){ e.target.textContent="select it"; }
    setTimeout(()=>{ e.target.textContent="copy"; }, 1400);
  });
}

function cLoad(text, name, origin, handle){
  CFG.text = text; CFG.name = name; CFG.origin = origin; CFG.handle = handle;
  CFG.dirty = false; CFG.touched = new Set();
  try{ CFG.data = JSON.parse(text); CFG.jsonError = null; }
  catch(e){ CFG.data = {}; CFG.jsonError = e.message; }
  cRender();
}

async function cOpen(){
  if(window.showOpenFilePicker){
    try{
      const [handle] = await window.showOpenFilePicker({
        types:[{description:"OKFM config", accept:{"application/json":[".json"]}}]});
      const file = await handle.getFile();
      cLoad(await file.text(), file.name, "opened from disk", handle);
      return;
    }catch(e){ if(e.name==="AbortError") return; }   // fall through if unsupported
  }
  const picker = document.createElement("input");
  picker.type = "file"; picker.accept = ".json,application/json";
  picker.addEventListener("change", async ()=>{
    const file = picker.files[0];
    if(file) cLoad(await file.text(), file.name, "opened from disk", null);
  });
  picker.click();
}

async function cSave(){
  // Written back in place where the browser allows it, downloaded where it does not. There
  // is no third option that does not mean running a server, and a server is the thing this
  // page exists without.
  if(CFG.handle && CFG.handle.createWritable){
    try{
      const w = await CFG.handle.createWritable();
      await w.write(CFG.text.endsWith("\n") ? CFG.text : CFG.text+"\n");
      await w.close();
      CFG.dirty = false; CFG.origin = "saved to disk"; cRender(); return;
    }catch(e){ /* permission withdrawn — fall through */ }
  }
  if(window.showSaveFilePicker){
    try{
      const handle = await window.showSaveFilePicker({
        suggestedName:"okfm.json",
        types:[{description:"OKFM config", accept:{"application/json":[".json"]}}]});
      const w = await handle.createWritable();
      await w.write(CFG.text.endsWith("\n") ? CFG.text : CFG.text+"\n");
      await w.close();
      CFG.handle = handle; CFG.name = handle.name; CFG.dirty = false;
      CFG.origin = "saved to disk"; cRender(); return;
    }catch(e){ if(e.name==="AbortError") return; }
  }
  cDownload(CFG.text);
}

function cDownload(text){
  const blob = new Blob([text.endsWith("\n")?text:text+"\n"], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = "okfm.json";
  a.click(); setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
}

/* ---------- view switching ---------- */
let MESH_EMPTY = false;

/* Four pages in one file. The URL hash decides which, so the back button, a bookmark, and
   a link someone pastes into a chat all work — `okfm-web-ui.html#config` opens the config.
   Nothing here listens for clicks: the links change the hash, and `hashchange` renders. */
const PAGES = {
  graph:   { view:"graph",  label:"Graph",
             lede:"Every concept, sized by inbound references, with the typed edges between them." },
  closure: { view:"chains", label:"Closure",
             lede:"Goal → evaluation → decision → experiment → outcome. Open loops are the point." },
  health:  { view:"stats",  label:"Health",
             lede:"Trust, staleness and drift across the whole mesh. Unfiltered, deliberately." },
  config:  { view:"config", label:"Config",
             lede:"The level 2 build's okfm.json — edited here, run from a terminal." },
};
const DEFAULT_PAGE = "graph";

function pageFromHash(){
  const key = (location.hash || "").replace(/^#\/?/, "").toLowerCase();
  return PAGES[key] ? key : DEFAULT_PAGE;
}

/** Show or hide a view container. Works on SVG and HTML alike; `.hidden` does not. */
function show(id, on){
  const el = document.getElementById(id);
  if(el) el.toggleAttribute("hidden", !on);
}

function render(){
  const page = pageFromHash();
  state.view = PAGES[page].view;
  const cf = page==="config";

  document.body.dataset.page = page;
  document.title = "OKFM — " + PAGES[page].label;
  document.getElementById("lede").textContent = PAGES[page].lede;
  document.querySelectorAll("nav.views a").forEach(a=>{
    const mine = a.getAttribute("href") === "#" + page;
    if(mine) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current");
  });

  // With no concepts there is nothing to graph, but there is still a config to fix — which
  // is the whole reason an empty mesh is usually empty.
  const live = !cf && !MESH_EMPTY;
  const g = live && page==="graph", ch = live && page==="closure", st = live && page==="health";
  // `toggleAttribute`, never the `.hidden` property. `svg` is an SVGElement, and SVGElement
  // does not implement `hidden` — `svg.hidden = false` sets a meaningless JS property and
  // leaves the attribute exactly where it was. The graph carried `hidden` from the markup
  // for the whole life of this file; nobody noticed because `#graph{display:block}` was
  // beating the UA rule anyway, so it rendered under every other view instead of behind it.
  show("graph", g); show("legendNote", g);
  show("chains", ch); show("stats", st); show("config", cf);
  if(document.getElementById("emptyState")) show("emptyState", !cf);
  if(g) buildGraph(); if(ch) buildChains(); if(st) buildStats();
  if(cf && !CFG.text) cLoad(JSON.stringify(CONFIG, null, 2), "okfm.json", "baked into this page", null);
  else if(cf) cRender();
}
window.addEventListener("hashchange", render);
window.addEventListener("resize", ()=>{ if(pageFromHash()==="graph") buildGraph(); });

/* ---------- empty state ---------- */
function showEmpty(){
  document.getElementById("gauges").innerHTML =
    `<div class="gauge"><span class="k">concepts</span><span class="v">0</span></div>`;
  document.getElementById("filters").innerHTML = `<h2 class="grp">Filters</h2>
    <p style="font-size:12px;color:var(--slate);line-height:1.5">Nothing to filter yet.</p>`;
  // Appended, never assigned over the stage. Replacing its contents would delete the config
  // panel, and a project with no concepts is exactly when configuring one is the thing to do.
  const host = document.createElement("div");
  host.id = "emptyState";
  document.querySelector("section.stage").appendChild(host);
  host.innerHTML = `
    <div class="empty-state" style="padding:64px 28px;max-width:560px;margin:0 auto;text-align:left">
      <p style="font-family:var(--mono);font-size:11px;letter-spacing:.11em;text-transform:uppercase;color:var(--slate-dim);margin:0 0 14px">No mesh found</p>
      <p style="font-size:14px;color:var(--ink);margin:0 0 18px">This project has no concepts yet, and the bundled guide has been removed.</p>
      <p style="margin:0 0 8px"><b>Write one file:</b></p>
      <pre style="font-family:var(--mono);font-size:11.5px;background:var(--panel);border:1px solid var(--line);padding:12px;overflow-x:auto;line-height:1.5">---
type: Decision
title: Use cents, not dollars
description: Integer cents everywhere; format at the edge.
status: stable
generated: { by: "human:you", at: "${new Date().toISOString().slice(0,10)}" }
---

# Why

Float dollars drifted a few cents per thousand rows.</pre>
      <p style="margin:16px 0 6px">Any <code>.md</code> file with a <code>type:</code> counts. Put it
        where your documents already are — the build reads <code>build.root</code> and whatever
        <code>build.include</code> names, and nothing scans your project on its own.</p>
      <p style="margin:0"><code>okfm view</code> regenerates this page · the <b>Config</b> tab
        shows what the build is set to read.</p>
    </div>`;
  document.getElementById("detail").innerHTML =
    `<div class="empty-state">Nothing selected.</div>`;
}

/* ---------- boot ---------- */
(async function boot(){
  await loadMesh();
  derive();
  resetFilters();
  document.getElementById("meshName").textContent = MESH.name;

  const badge = document.getElementById("genAt");
  if (SOURCE === "live"){
    badge.textContent = "live · " + (MESH.generated_at || "now");
    badge.title = "Read from " + INDEX_URL;
  } else if (SOURCE === "baked"){
    // Neutral, not amber. This is what a successful build looks like, and colouring it as a
    // warning sent adopters hunting for a failure that had not happened — and pointed them at
    // an `okfm view --serve` that does not exist and an okfm-guide/ they may never have had.
    badge.textContent = "baked · " + (MESH.generated_at || "snapshot");
    badge.title = "Metadata baked into this page by the last build. Re-run the build to refresh it.";
  } else {
    badge.textContent = "empty";
  }

  if (!MESH.concepts.length){ MESH_EMPTY = true; showEmpty(); render(); return; }
  gauges(); filters(); detail(); render();
})();
</script>
</body>
</html>
